version: '3.8'

services:
  planovasaas:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    environment:
      - PORT=8090
      - DB_PATH=/app/data/planova.db
      - STORAGE_PATH=/app/storage
    restart: unless-stopped

volumes:
  storage:
  data:
