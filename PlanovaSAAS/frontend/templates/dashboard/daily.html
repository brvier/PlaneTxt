<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily - {{.Date}}</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/encryption.js"></script>
    <script src="/static/js/key_derivation.js"></script>
    <script src="/static/js/password_cache.js"></script>
    <script src="/static/js/sync.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/htmx.min.js"></script>
</head>
<body class="bg-white">
    <div id="daily-editor" class="h-full">
        <div class="mb-4 flex justify-between items-start">
            <div>
                <h2 class="text-3xl font-bold">{{.Date}}</h2>
                <div class="text-sm text-gray-600">
                    Daily file: dailies/{{.Date}}.md
                </div>
            </div>
            
            <div class="flex gap-2">
                <button class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
                        hx-post="/api/sync/pull"
                        hx-indicator="#sync-spinner">
                    Pull Changes
                </button>
                <span id="sync-spinner" class="htmx-indicator hidden text-blue-600">
                    Syncing...
                </span>
                <button class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
                        hx-post="/api/sync/push"
                        hx-trigger="sync-trigger"
                        hx-indicator="#push-spinner">
                    Push Local Changes
                </button>
                <span id="push-spinner" class="htmx-indicator hidden text-blue-600">
                    Pushing...
                </span>
                <span class="text-sm text-gray-600">
                    Last sync: {{if .LastSyncAt}}{{.LastSyncAt}}{{else}}Never{{end}}
                </span>
            </div>
        </div>
    </div>
        
        <textarea id="content-editor"
                  name="content"
                  class="w-full h-full min-h-[600px] p-4 border border-gray-300 rounded font-mono text-sm resize-none"
                  hx-post="/api/files/update/{{.ID}}"
                  hx-trigger="change"
                  hx-indicator="#save-spinner"
                  hx-swap="none"
                  data-encrypted="true">{{.Content}}</textarea>

        <span id="save-spinner" class="htmx-indicator hidden text-gray-600">
            Saving...
        </span>

        <div id="conflict-notification" class="hidden mt-4 p-4 bg-yellow-100 border border-yellow-400 rounded">
            <!-- Conflict notification will be shown here via JS -->
        </div>

        <div id="sync-status" class="hidden mt-4 p-4 bg-green-100 border border-green-400 rounded">
            <!-- Sync status will be shown here via JS -->
        </div>

        <script>
            document.getElementById('content-editor').addEventListener('change', async function(evt) {
                const passwordCache = window.passwordCache;
                const content = evt.target.value;
                
                if (!passwordCache || !passwordCache.hasPassword()) {
                    alert('Please enter your password first');
                    evt.target.value = '';
                    return;
                }
                
                const salt = window.generateSalt();
                const encrypted = await window.encryptContent(content, passwordCache.getPassword(), salt);
                
                const formData = new FormData();
                formData.append('content', encrypted);
                formData.append('salt', encrypted.iv);
                formData.append('checksum', encrypted.checksum);
                
                await fetch('/api/files/update/{{.ID}}', {
                    method: 'POST',
                    body: formData
                }).then(response => response.json()).then(result => {
                    if (result.status === 'uploaded') {
                        document.getElementById('save-spinner').classList.add('hidden');
                        console.log('File saved successfully');
                    } else {
                        alert('Failed to save: ' + (result.error || 'Unknown error'));
                    }
                }).catch(err => {
                    console.error('Error:', err);
                    alert('Error saving file: ' + err.message);
                });
            });
        
        document.getElementById('content-editor').addEventListener('keydown', function(evt) {
            const saveButton = document.getElementById('sync-trigger');
            if (evt.ctrlKey && evt.key === 's') {
                saveButton.click();
            }
        });
            
        // Listen for custom sync status events from sync.js
        document.addEventListener('sync-pull-complete', function(e) {
            const statusEl = document.getElementById('sync-status');
            if (statusEl) {
                statusEl.textContent = 'Pull completed successfully';
                statusEl.classList.remove('hidden');
                setTimeout(() => {
                    statusEl.classList.add('hidden');
                }, 3000);
            }
        });
        
        document.addEventListener('sync-push-complete', function(e) {
            const statusEl = document.getElementById('sync-status');
            if (statusEl) {
                statusEl.textContent = 'Push completed successfully';
                statusEl.classList.remove('hidden');
                setTimeout(() => {
                    statusEl.classList.add('hidden');
                }, 3000);
            }
        });
        
        document.addEventListener('sync-conflict', function(e) {
            const conflictEl = document.getElementById('conflict-notification');
            const details = e.detail;
            
            if (details && details.length > 0) {
                let message = 'Merge conflicts detected:\n\n';
                
                details.forEach(conflict => {
                    message += conflict.type + ' version ' + conflict.localVersion + ' vs ' + conflict.serverVersion + '\n';
                    if (conflict.resolved) {
                        message += ' → Resolved (Version ' + conflict.mergedVersion + ')\n';
                    } else {
                        message += ' → Rejected (Version ' + conflict.serverVersion + ')\n';
                    }
                });
                
                conflictEl.textContent = message;
                conflictEl.classList.remove('hidden');
                setTimeout(() => {
                    conflictEl.classList.add('hidden');
                }, 5000);
            }
        });
    </script>
</body>
</html>
