name: planova
description: A future proof opinionated software written with flutter to manage your life in plaintext - todo, agenda, journal and notes.
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  table_calendar: ^3.0.9
  flutter_markdown: ^0.7.7+1
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  file_picker: ^12.0.0-beta.1
  intl: ^0.20.2
  provider: ^6.1.1
  path: ^1.8.3
  permission_handler: ^12.0.1
  device_info_plus: ^13.1.0
  home_widget: ^0.9.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  package_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#3c3836"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#458588"
    theme_color: "#458588"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon.png"
